services:
  - type: web
    name: neurosync-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python scripts/migrate.py && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
